[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bibreview"
version = "1.6.19"
description = "Generic bibliographic engine for reproducible literature-review websites"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
  {name = "Ghislain Haine"},
]
dependencies = [
  "PyYAML>=6,<7",
  "Unidecode>=1.3,<2",
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
  "urllib3>=2,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
bibreview = "bibreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
