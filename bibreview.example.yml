schema_version: 1

environment:
  file: .env

project:
  name: Example Review
  slug: example-review
  title: Example bibliographic review
  repository: https://example.org/example-review
  contact:
    name: Example Maintainer
    email: maintainer@example.org

# Optional display-only arXiv feed cache. This is deliberately separate from
# the DOI-backed canonical bibliography and Publication model.
arxiv:
  enabled: false
  query: all:fluid AND all:structure
  max_results: 25
  sort_by: lastUpdatedDate
  sort_order: descending
  output: docs/assets/data/arxiv.json

paths:
  bibliography: data/bibliography.json
  collected: data/collected.json
  author_mappings: data/authors.json
  known: data/known.txt
  pending: data/pending.txt
  rejected: data/rejected.txt
  review: data/review.txt
  bibtex: bib
  archive: archive
  site: site

discovery:
  provider: openalex
  query: fluid-structure interaction
  max_pages: 20
  accepted_types:
    - journal-article
    - proceedings-article
    - book-chapter
    - book
    - monograph
  exclude_doi_substrings: []

# Existing-publication refresh is opt-in. Here, incomplete journal articles are
# checked against their current DOI BibTeX; stale records become review evidence
# and only explicitly accepted missing-field fills reach collected staging.
refresh:
  types:
    - journal-article
    - proceedings-article
  when_missing_any:
    - volume
    - issue
    - pages

# Non-destructive historical audits keep their own resumable campaign state and
# comparison report. These files are separate from collected.json staging.
audit:
  campaign: data/audit/campaign.json
  report: data/audit/report.json
  batch_size: 50

references:
  campaign: data/references/campaign.json
  report: data/references/report.json
  batch_size: 50

relevance:
  patterns:
    - 'fluid[-\\s]+structure'
  unmatched: manual-review

providers:
  crossref:
    enabled: true
    min_interval_seconds: 0.0

  openalex:
    enabled: true
    min_interval_seconds: 0.0
    # Optional: discovery also works without an OpenAlex API key.
    api_key_env: OPENALEX_API_KEY

  # Optional enrichment providers. Enable only the services you use.
  elsevier:
    enabled: false
    min_interval_seconds: 0.0
    api_key_env: ELSEVIER_API_KEY

  springer:
    enabled: false
    min_interval_seconds: 0.0
    api_key_env: SPRINGER_API_KEY

  ieee:
    enabled: false
    min_interval_seconds: 0.0
    api_key_env: IEEE_API_KEY

  semantic_scholar:
    enabled: false
    min_interval_seconds: 1.1
    # Optional; authenticated requests have dedicated rate limits.
    api_key_env: SEMANTIC_SCHOLAR_API_KEY

  mendeley:
    enabled: false
    min_interval_seconds: 0.0
    # Application ID + Secret from the Mendeley Developer Portal.
    # BibReview obtains and refreshes short-lived OAuth access tokens itself.
    client_id_env: MENDELEY_CLIENT_ID
    client_secret_env: MENDELEY_CLIENT_SECRET

site:
  enabled: false
  implementation: jekyll
  source: site
  jekyll:
    # Projects choose their own Jekyll category names explicitly.
    category_by_type:
      journal-article: articles
      proceedings-article: proceedings
      book-chapter: chapters
      book: books
      monograph: books
    event_category_rules:
      - pattern: 'Conference|Workshop|Symposium'
        category: proceedings
    isbn_types:
      - book
      - monograph
    include_authorless_year_publications: true
