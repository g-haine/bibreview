schema_version: 1

project:
  name: Example Review
  slug: example-review
  title: Example bibliographic review

paths:
  bibliography: data/bibliography.json
  collected: data/collected.json
  author_mappings: data/authors.json
  known: data/known.txt
  pending: data/pending.txt
  rejected: data/rejected.txt
  review: data/review.txt
  bibtex: bib
  archive: archive
  site: site

discovery:
  provider: openalex
  query: fluid-structure interaction
  max_pages: 20
  accepted_types:
    - journal-article
    - proceedings-article
    - book-chapter
    - book
    - monograph
  exclude_doi_substrings: []

# Existing-publication refresh is opt-in. Here, incomplete journal articles are
# checked against their current DOI BibTeX; stale records are recollected into
# data/collected.json and later updated through the normal merge command.
refresh:
  types:
    - journal-article
  when_missing_any:
    - volume
    - issue
    - pages

relevance:
  patterns:
    - 'fluid[-\\s]+structure'
  unmatched: manual-review

providers:
  crossref:
    enabled: true
  openalex:
    enabled: true
    # Optional: discovery also works without an OpenAlex API key.
    api_key_env: OPENALEX_API_KEY

site:
  enabled: false
